<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 45">
<g transform="translate(22.5 39.2) scale(1.0158) translate(-22.50 -43.00)"><defs>
    <linearGradient id="bK-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#555"/>
    </linearGradient>
    <linearGradient id="bK-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a22"/>
      <stop offset="1" stop-color="#a22"/>
    </linearGradient>
  </defs>

  <!-- Terran Command Center, red player -->
  <g stroke="#222" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.35">
    <!-- Rounded foundation -->
    <ellipse cx="22.5" cy="28.8" rx="19" ry="13.7" fill="#555"/>
    <ellipse cx="22.5" cy="35.5" rx="15.8" ry="7.5" fill="#a22"/>

    <!-- Team-color armor on the outer bays -->
    <ellipse cx="8.5" cy="27" rx="5.8" ry="8.3" fill="url(#bK-red)"/>
    <ellipse cx="36.5" cy="27" rx="5.8" ry="8.3" fill="url(#bK-red)"/>
    <ellipse cx="8" cy="34" rx="4.5" ry="5" fill="#a22"/>
    <ellipse cx="37" cy="34" rx="4.5" ry="5" fill="#a22"/>

    <!-- Upper deck -->
    <ellipse cx="22.5" cy="25.5" rx="14.3" ry="10.5" fill="url(#bK-body)"/>
    <ellipse cx="22.5" cy="28" rx="12.8" ry="7" fill="#fff"/>

    <!-- Raised command hub -->
    <ellipse cx="22.5" cy="19" rx="10.2" ry="6" fill="url(#bK-red)"/>
