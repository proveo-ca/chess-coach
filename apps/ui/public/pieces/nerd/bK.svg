<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 45">
  <defs>
    <linearGradient id="bK-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b7c0c8"/>
      <stop offset="1" stop-color="#59636e"/>
    </linearGradient>
    <linearGradient id="bK-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef5b55"/>
      <stop offset="1" stop-color="#8f181c"/>
    </linearGradient>
  </defs>

  <!-- Terran Command Center, red player -->
  <g stroke="#20262c" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.35">
    <!-- Rounded foundation -->
    <ellipse cx="22.5" cy="28.8" rx="19" ry="13.7" fill="#414b55"/>
    <ellipse cx="22.5" cy="35.5" rx="15.8" ry="7.5" fill="#29323a"/>

    <!-- Team-color armor on the outer bays -->
    <ellipse cx="8.5" cy="27" rx="5.8" ry="8.3" fill="url(#bK-red)"/>
    <ellipse cx="36.5" cy="27" rx="5.8" ry="8.3" fill="url(#bK-red)"/>
    <ellipse cx="8" cy="34" rx="4.5" ry="5" fill="#721519"/>
    <ellipse cx="37" cy="34" rx="4.5" ry="5" fill="#721519"/>

    <!-- Upper deck -->
    <ellipse cx="22.5" cy="25.5" rx="14.3" ry="10.5" fill="url(#bK-body)"/>
    <ellipse cx="22.5" cy="28" rx="12.8" ry="7" fill="#7e8993"/>

    <!-- Raised command hub -->
    <ellipse cx="22.5" cy="19" rx="10.2" ry="6" fill="url(#bK-red)"/>
    <ellipse cx="22.5" cy="15.5" rx="9" ry="4.2" fill="#d66a68"/>
    <ellipse cx="22.5" cy="15.1" rx="6.2" ry="2.7" fill="#414b55"/>
    <ellipse cx="22.5" cy="14.3" rx="3.8" ry="2" fill="#252d34"/>

    <!-- Front loading bay -->
    <ellipse cx="22.5" cy="35" rx="7.3" ry="7.5" fill="#252d34"/>
    <ellipse cx="22.5" cy="35.5" rx="5.3" ry="5.8" fill="#101519"/>
    <ellipse cx="22.5" cy="32.5" rx="5.1" ry="1.5" fill="#a32629"/>
    <path d="M19.1 36.4h6.8M19 39h7" fill="none" stroke="#687782" stroke-width=".9"/>

    <!-- Navigation lamps -->
    <g fill="#ffd75a" stroke="#5c4610" stroke-width=".65">
      <circle cx="12.2" cy="34.2" r="1"/>
      <circle cx="32.8" cy="34.2" r="1"/>
      <circle cx="9.3" cy="25.1" r=".8"/>
      <circle cx="35.7" cy="25.1" r=".8"/>
    </g>
  </g>
</svg>
