# SPEC: _spec/architecture.puml
[workspace]
members = ["crates/learning", "crates/policy-io"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
burn = { version = "=0.22.0", default-features = false, features = ["std", "flex", "optim", "store"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
sha2 = "=0.10.9"
