# SPEC: _spec/architecture.puml
[settings]
auto_install = false
task.run_auto_install = false

[tools]
"core:bun" = "1.4.0"
"core:rust" = { version = "1.95.0", profile = "minimal", components = ["rustfmt", "clippy"] }

[tasks."host:preflight"]
description = "Host-only read-only mise/sbx identity and help; no provisioning or training"
raw_args = true
raw = true
quiet = true
env.PYTHONDONTWRITEBYTECODE = "1"
run = "python3 -I -B tooling/runtime/host_preflight.py"

[tasks."host:sbx-contract"]
description = "Host-only fixed sbx version/create/exec/lifecycle help; no daemon or workload operations"
raw_args = true
raw = true
quiet = true
env.PYTHONDONTWRITEBYTECODE = "1"
run = "python3 -I -B tooling/runtime/host_preflight.py --sbx-contract"

[tasks."host:admission-facts"]
description = "Host-only CPU/RAM/GPU and selected filesystem metadata; no allocation or workload inspection"
raw_args = true
raw = true
quiet = true
env.PYTHONDONTWRITEBYTECODE = "1"
run = "python3 -I -B tooling/runtime/host_preflight.py --admission-facts"
